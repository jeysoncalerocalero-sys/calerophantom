name: PHANTOM FF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencias
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui third_party/imgui
          git clone --depth 1 --recursive https://github.com/jmpews/Dobby third_party/Dobby

      - name: Herramientas
        run: |
          echo "$(ls -d $ANDROID_HOME/build-tools/* | tail -n1)" >> $GITHUB_PATH
          mkdir -p tools
          wget -q -O tools/baksmali.jar https://github.com/baksmali/smali/releases/download/2.5.2/baksmali-2.5.2.jar
          wget -q -O tools/smali.jar    https://github.com/baksmali/smali/releases/download/2.5.2/smali-2.5.2.jar

      - name: Clave
        run: |
          if [ ! -f calero.jks ]; then
            keytool -genkeypair -v -keystore calero.jks -alias calero \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Calero"
          fi

      - name: Compilar
        run: |
          cmake -S src -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Free Fire
        run: |
          wget -q --user-agent="Mozilla/5.0 (Linux; Android 13)" \
            -O ff.xapk "https://d.apkpure.com/b/XAPK/com.dts.freefireth?version=latest"
          ls -lh ff.xapk

      - name: Inyectar
        run: |
          chmod +x scripts/inject.sh
          bash scripts/inject.sh ff.xapk build/libphantom.so PHANTOM_FF.apk calero.jks

      - uses: actions/upload-artifact@v4
        with:
          name: TU-APK
          path: PHANTOM_FF.apk

      - uses: actions/upload-artifact@v4
        with:
          name: clave-de-firma
          path: calero.jks
